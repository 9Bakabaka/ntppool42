name?: PR check
on:
  pull_request:
    branches:
      - master
permissions:
  contents: read
jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Format all
        run: tools/fmt-all.sh
      - name: Check if working tree clean
        run: 'test -z $(git --no-pager diff data)'
